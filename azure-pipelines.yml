trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

resources:
  - repo: self

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV

  - name: applyTerraform
    displayName: Apply terraform?
    type: boolean
    default: false

variables:
  - group: bootcamp-dev

  - name: azureServiceConnection
    value: 'avanti-bootcamp'

  - name: terraformDirectory
    value: '$(Build.SourcesDirectory)/terraform'

  - name: appDirectory
    value: '$(Build.SourcesDirectory)/dotnet-container-app'

  - name: solutionPath
    value: '$(appDirectory)/src/ContainerApp.sln'

  - name: testProject
    value: '$(appDirectory)/src/ContainerApp.Test/ContainerApp.Test.csproj'

  - name: dockerBuildContext
    value: '$(appDirectory)/src'

  - name: webDockerfile
    value: '$(appDirectory)/src/ContainerApp.WebApp/Dockerfile'

  - name: weatherDockerfile
    value: '$(appDirectory)/src/ContainerApp.WeatherApi/Dockerfile'

  - name: acrName
    value: 'avantiavantibootcampacr'

  - name: containerRegistry
    value: 'avantiavantibootcampacr.azurecr.io'

  - name: webImageRepository
    value: 'containerapp-web'

  - name: weatherImageRepository
    value: 'containerapp-weather'

  - name: imageTag
    value: '$(Build.BuildId)'

  - name: resourceGroupName
    value: 'avanti-avanti-bootcamp-rg'

  - name: aksClusterName
    value: 'avanti-avanti-bootcamp-aks'

  - name: webDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.WebApp/k8s-deployment.yaml'

  - name: weatherDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.WeatherApi/k8s-deployment.yaml'

    - name: webDeploymentName
      value: 'containerapp-webapp-deploy'

    - name: weatherDeploymentName
      value: 'containerapp-weatherapi-deploy'

  - name: weatherDeploymentName
    value: 'containerapp-weatherapi'

  - name: weatherContainerName
    value: 'containerapp-weatherapi'

  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: Terraform
    displayName: Terraform Plan Apply
    jobs:
      - job: TerraformJob
        displayName: Terraform Job
        pool:
          vmImage: windows-latest

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(terraformDirectory)'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }}
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

          - task: PublishBuildArtifacts@1
            displayName: Publish Terraform Plan Files
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/terraform/modules/template1'
              ArtifactName: 'terraform-plan-${{ parameters.environment }}'
              publishLocation: Container

          - task: AzureCLI@2
            displayName: Terraform Apply
            condition: and(succeeded(), eq('${{ parameters.applyTerraform }}', 'True'))
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(terraformDirectory)'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }} -Apply
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: DotNetBuildTest
    displayName: Build and Test .NET App
    dependsOn: Terraform
    condition: succeeded()
    jobs:
      - job: BuildTest
        displayName: Build and Test
        pool:
          vmImage: $(vmImageName)

        steps:
          - checkout: self

          - bash: |
              echo "Build.SourcesDirectory = $(Build.SourcesDirectory)"
              echo "appDirectory = $(appDirectory)"
              echo "solutionPath = $(solutionPath)"
              echo "testProject = $(testProject)"
              echo "webDockerfile = $(webDockerfile)"
              echo "weatherDockerfile = $(weatherDockerfile)"

              find "$(Build.SourcesDirectory)" -name "*.sln"
              find "$(Build.SourcesDirectory)" -name "Dockerfile"

              if [ ! -f "$(solutionPath)" ]; then
                echo "ERROR: Solution file not found at $(solutionPath)"
                exit 1
              fi

              if [ ! -f "$(testProject)" ]; then
                echo "ERROR: Test project not found at $(testProject)"
                exit 1
              fi

              if [ ! -f "$(webDockerfile)" ]; then
                echo "ERROR: WebApp Dockerfile not found at $(webDockerfile)"
                exit 1
              fi

              if [ ! -f "$(weatherDockerfile)" ]; then
                echo "ERROR: WeatherApi Dockerfile not found at $(weatherDockerfile)"
                exit 1
              fi
            displayName: Verify Repository Layout

          - task: UseDotNet@2
            displayName: Install .NET 6 SDK
            inputs:
              packageType: sdk
              version: '6.x'

          - task: UseDotNet@2
            displayName: Install .NET 8 SDK
            inputs:
              packageType: sdk
              version: '8.x'

          - script: |
              dotnet restore "$(solutionPath)"
              dotnet build "$(solutionPath)" --configuration Release --no-restore
              dotnet test "$(testProject)" --configuration Release --no-build --logger trx
            displayName: Restore Build Test

          - task: PublishTestResults@2
            displayName: Publish Test Results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'

  - stage: DockerBuildPush
    displayName: Build and Push Docker Images
    dependsOn: DotNetBuildTest
    condition: succeeded()
    jobs:
      - job: DockerBuild
        displayName: Docker Build Push
        pool:
          vmImage: $(vmImageName)

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Verify ACR
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr show --name $(acrName) --output table
                echo "Login Server:"
                az acr show --name $(acrName) --query loginServer -o tsv

          - task: AzureCLI@2
            displayName: Build and Push Images to ACR
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name "$(acrName)"

                docker build \
                  -f "$(webDockerfile)" \
                  -t "$(containerRegistry)/$(webImageRepository):$(imageTag)" \
                  -t "$(containerRegistry)/$(webImageRepository):latest" \
                  "$(dockerBuildContext)"

                docker push "$(containerRegistry)/$(webImageRepository):$(imageTag)"
                docker push "$(containerRegistry)/$(webImageRepository):latest"

                docker build \
                  -f "$(weatherDockerfile)" \
                  -t "$(containerRegistry)/$(weatherImageRepository):$(imageTag)" \
                  -t "$(containerRegistry)/$(weatherImageRepository):latest" \
                  "$(dockerBuildContext)"

                docker push "$(containerRegistry)/$(weatherImageRepository):$(imageTag)"
                docker push "$(containerRegistry)/$(weatherImageRepository):latest"

  - stage: DeployToAKS
    displayName: Deploy to AKS
    dependsOn: DockerBuildPush
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Deploy Apps to AKS
        pool:
          vmImage: $(vmImageName)

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Deploy to Kubernetes
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl apply -f "$(webDeploymentManifest)"
                kubectl apply -f "$(weatherDeploymentManifest)"

                kubectl set image deployment/$(webDeploymentName) \
                  $(webContainerName)="$(containerRegistry)/$(webImageRepository):$(imageTag)"

                kubectl set image deployment/$(weatherDeploymentName) \
                  $(weatherContainerName)="$(containerRegistry)/$(weatherImageRepository):$(imageTag)"

                kubectl rollout status deployment/$(webDeploymentName)
                kubectl rollout status deployment/$(weatherDeploymentName)