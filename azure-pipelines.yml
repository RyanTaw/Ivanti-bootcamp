trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

resources:
  - repo: self

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV

  - name: destroyTerraform
    displayName: Destroy Infrastructure?
    type: boolean
    default: false

variables:
  - group: bootcamp-dev

  - name: azureServiceConnection
    value: 'avanti-bootcamp'

  - name: appDirectory
    value: '$(Build.SourcesDirectory)/dotnet-container-app'

  - name: containerRegistry
    value: 'avantiavantibootcampacr.azurecr.io'

  - name: webImageRepository
    value: 'containerapp-web'

  - name: weatherImageRepository
    value: 'containerapp-weather'

  - name: imageTag
    value: 'latest'

  - name: resourceGroupName
    value: 'avanti-avanti-bootcamp-rg'

  - name: aksClusterName
    value: 'avanti-avanti-bootcamp-aks'

  - name: webDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.WebApp/k8s-deployment.yaml'

  - name: weatherDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.WeatherApi/k8s-deployment.yaml'

  - name: webDeploymentName
    value: 'containerapp-webapp-deploy'

  - name: webContainerName
    value: 'containerapp-webapp'

  - name: weatherDeploymentName
    value: 'containerapp-weatherapi-deploy'

  - name: weatherContainerName
    value: 'containerapp-weatherapi'

  - name: namespace
    value: 'bootcamp'

  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: TerraformPlan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: latest

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(Build.SourcesDirectory)/terraform'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }}
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: ManualApproval
    displayName: Approve Terraform Action
    dependsOn: TerraformPlan
    condition: and(succeeded(), ne('${{ parameters.terraformAction }}', 'plan'))
    jobs:
      - job: WaitForApproval
        displayName: Confirm Apply or Destroy
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 60
            inputs:
              instructions: 'Terraform plan completed. Approve to continue with ${{ parameters.terraformAction }}.'
              onTimeout: reject

  - stage: TerraformApply
    displayName: Terraform Apply
    dependsOn: ManualApproval
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'apply'))
    jobs:
      - job: Apply
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: latest

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(Build.SourcesDirectory)/terraform'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }} -Apply
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: TerraformDestroy
    displayName: Terraform Destroy
    dependsOn: ManualApproval
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'destroy'))
    jobs:
      - job: Destroy
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: latest

          - task: AzureCLI@2
            displayName: Terraform Destroy
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(Build.SourcesDirectory)/terraform'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }} -Destroy
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: DotNetBuildTest
    displayName: Build and Test .NET App
    condition: and(succeeded(), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: BuildTest
        displayName: Build and Test
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
          - task: UseDotNet@2
          - task: UseDotNet@2
          - bash: |
              echo "Verify Repository Layout"
          - script: |
              dotnet restore
              dotnet build
              dotnet test
          - task: PublishTestResults@2

  - stage: DockerBuildPush
    displayName: Build and Push Docker Images
    condition: and(succeeded(), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: DockerBuild
        displayName: Docker Build Push
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
          - task: AzureCLI@2

  - stage: DeployToAKS
    displayName: Deploy to AKS
    condition: and(succeeded(), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: Deploy
        displayName: Deploy Apps to AKS
        pool:
          vmImage: $(vmImageName)

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Create Namespace
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                az aks get-credentials \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl create namespace "$(namespace)" --dry-run=client -o yaml | kubectl apply -f -

          - task: AzureCLI@2
            displayName: Deploy to Kubernetes
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                az aks get-credentials \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl get nodes

                WEB_IMAGE="$(containerRegistry)/$(webImageRepository):$(imageTag)"
                WEATHER_IMAGE="$(containerRegistry)/$(weatherImageRepository):$(imageTag)"

                cp "$(webDeploymentManifest)" web-deployment.yaml
                cp "$(weatherDeploymentManifest)" weather-deployment.yaml

                sed -i "s|_ImageUrlApp_|$WEB_IMAGE|g" web-deployment.yaml
                sed -i "s|_ImageUrlApp_|$WEATHER_IMAGE|g" weather-deployment.yaml

                kubectl apply -f web-deployment.yaml -n "$(namespace)"
                kubectl apply -f weather-deployment.yaml -n "$(namespace)"

                kubectl set image deployment/$(webDeploymentName) \
                  "$(webContainerName)=$WEB_IMAGE" \
                  -n "$(namespace)"

                kubectl set image deployment/$(weatherDeploymentName) \
                  "$(weatherContainerName)=$WEATHER_IMAGE" \
                  -n "$(namespace)"

                kubectl rollout status deployment/$(webDeploymentName) -n "$(namespace)"
                kubectl rollout status deployment/$(weatherDeploymentName) -n "$(namespace)"