trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

resources:
  - repo: self

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV

  - name: applyTerraform
    displayName: Apply Terraform?
    type: boolean
    default: false

  - name: destroyTerraform
    displayName: Destroy Terraform?
    type: boolean
    default: false

variables:
  - group: bootcamp-dev

  - name: azureServiceConnection
    value: 'avanti-bootcamp'

  - name: terraformDirectory
    value: '$(Build.SourcesDirectory)/terraform'

  - name: appDirectory
    value: '$(Build.SourcesDirectory)/dotnet-container-app'

  - name: solutionPath
    value: '$(appDirectory)/src/ContainerApp.sln'

  - name: testProject
    value: '$(appDirectory)/src/ContainerApp.Test/ContainerApp.Test.csproj'

  - name: dockerBuildContext
    value: '$(appDirectory)/src'

  - name: webDockerfile
    value: '$(appDirectory)/src/ContainerApp.WebApp/Dockerfile'

  - name: weatherDockerfile
    value: '$(appDirectory)/src/ContainerApp.WeatherApi/Dockerfile'

  - name: itemsDockerfile
    value: '$(appDirectory)/src/ContainerApp.ItemsApi/Dockerfile'

  - name: acrName
    value: 'avantiavantibootcampacr'

  - name: containerRegistry
    value: 'avantiavantibootcampacr.azurecr.io'

  - name: webImageRepository
    value: 'containerapp-web'

  - name: weatherImageRepository
    value: 'containerapp-weather'

  - name: itemsImageRepository
    value: 'containerapp-itemsapi'

  - name: imageTag
    value: '$(Build.BuildId)'

  - name: resourceGroupName
    value: 'avanti-avanti-bootcamp-rg'

  - name: aksClusterName
    value: 'avanti-avanti-bootcamp-aks'

  - name: namespace
    value: 'bootcamp'

  - name: webDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.WebApp/k8s-deployment.yaml'

  - name: weatherDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.WeatherApi/k8s-deployment.yaml'

  - name: itemsDeploymentManifest
    value: '$(appDirectory)/src/ContainerApp.ItemsApi/k8s-deployment.yaml'

  - name: webDeploymentName
    value: 'containerapp-webapp-deploy'

  - name: webContainerName
    value: 'containerapp-webapp'

  - name: weatherDeploymentName
    value: 'containerapp-weatherapi-deploy'

  - name: weatherContainerName
    value: 'containerapp-weatherapi'

  - name: itemsDeploymentName
    value: 'containerapp-itemsapi-deploy'

  - name: itemsContainerName
    value: 'containerapp-itemsapi'

  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: TerraformPlan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - pwsh: |
              if ("${{ parameters.applyTerraform }}" -eq "True" -and "${{ parameters.destroyTerraform }}" -eq "True") {
                throw "Choose either Apply Terraform OR Destroy Terraform, not both."
              }
            displayName: Validate Terraform Selection

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(terraformDirectory)'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }}
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: TerraformApply
    displayName: Terraform Apply
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq('${{ parameters.applyTerraform }}', 'True'), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: Apply
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(terraformDirectory)'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }} -Apply
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: TerraformDestroy
    displayName: Terraform Destroy
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq('${{ parameters.destroyTerraform }}', 'True'), eq('${{ parameters.applyTerraform }}', 'False'))
    jobs:
      - job: Destroy
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: Terraform Destroy
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: '$(terraformDirectory)'
              inlineScript: |
                .\prepare_template1.ps1 ${{ parameters.environment }} -Destroy
            env:
              TF_VAR_tenant_id: $(tenantId)
              TF_VAR_sql_admin_username: $(sqlAdminUsername)
              TF_VAR_sql_admin_password: $(sqlAdminPassword)

  - stage: DotNetBuildTest
    displayName: Build and Test .NET App
    dependsOn: TerraformApply
    condition: and(succeeded(), eq('${{ parameters.applyTerraform }}', 'True'), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: BuildTest
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '6.x'

          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '8.x'

          - script: |
              dotnet restore "$(solutionPath)"
              dotnet build "$(solutionPath)" --configuration Release --no-restore
              dotnet test "$(testProject)" --configuration Release --no-build --logger trx
            displayName: Restore Build Test

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'

  - stage: DockerBuildPush
    displayName: Build and Push Docker Images
    dependsOn: DotNetBuildTest
    condition: and(succeeded(), eq('${{ parameters.applyTerraform }}', 'True'), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: DockerBuild
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build and Push Images to ACR
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                az acr login --name "$(acrName)"

                docker build -f "$(webDockerfile)" -t "$(containerRegistry)/$(webImageRepository):$(imageTag)" -t "$(containerRegistry)/$(webImageRepository):latest" "$(dockerBuildContext)"
                docker push "$(containerRegistry)/$(webImageRepository):$(imageTag)"
                docker push "$(containerRegistry)/$(webImageRepository):latest"

                docker build -f "$(weatherDockerfile)" -t "$(containerRegistry)/$(weatherImageRepository):$(imageTag)" -t "$(containerRegistry)/$(weatherImageRepository):latest" "$(dockerBuildContext)"
                docker push "$(containerRegistry)/$(weatherImageRepository):$(imageTag)"
                docker push "$(containerRegistry)/$(weatherImageRepository):latest"

                docker build -f "$(itemsDockerfile)" -t "$(containerRegistry)/$(itemsImageRepository):$(imageTag)" -t "$(containerRegistry)/$(itemsImageRepository):latest" "$(dockerBuildContext)"
                docker push "$(containerRegistry)/$(itemsImageRepository):$(imageTag)"
                docker push "$(containerRegistry)/$(itemsImageRepository):latest"

  - stage: DeployToAKS
    displayName: Deploy to AKS
    dependsOn: DockerBuildPush
    condition: and(succeeded(), eq('${{ parameters.applyTerraform }}', 'True'), eq('${{ parameters.destroyTerraform }}', 'False'))
    jobs:
      - job: Deploy
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Deploy to Kubernetes
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                az aks get-credentials \
                  --resource-group "$(resourceGroupName)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl create namespace "$(namespace)" --dry-run=client -o yaml | kubectl apply -f -

                WEB_IMAGE="$(containerRegistry)/$(webImageRepository):$(imageTag)"
                WEATHER_IMAGE="$(containerRegistry)/$(weatherImageRepository):$(imageTag)"
                TODO_IMAGE="$(containerRegistry)/$(itemsImageRepository):$(imageTag)"

                cp "$(webDeploymentManifest)" web-deployment.yaml
                cp "$(weatherDeploymentManifest)" weather-deployment.yaml
                cp "$(itemsDeploymentManifest)" items-deployment.yaml

                sed -i "s|_ImageUrlApp_|$WEB_IMAGE|g" web-deployment.yaml
                sed -i "s|_ImageUrlApp_|$WEATHER_IMAGE|g" weather-deployment.yaml
                sed -i "s|_ImageUrlApp_|$TODO_IMAGE|g" items-deployment.yaml

                kubectl apply -f web-deployment.yaml -n "$(namespace)"
                kubectl apply -f weather-deployment.yaml -n "$(namespace)"
                kubectl apply -f items-deployment.yaml -n "$(namespace)"

                kubectl set image deployment/$(webDeploymentName) "$(webContainerName)=$WEB_IMAGE" -n "$(namespace)"
                kubectl set image deployment/$(weatherDeploymentName) "$(weatherContainerName)=$WEATHER_IMAGE" -n "$(namespace)"
                kubectl set image deployment/$(itemsDeploymentName) "$(itemsContainerName)=$TODO_IMAGE" -n "$(namespace)"

                kubectl rollout status deployment/$(webDeploymentName) -n "$(namespace)"
                kubectl rollout status deployment/$(weatherDeploymentName) -n "$(namespace)"
                kubectl rollout status deployment/$(itemsDeploymentName) -n "$(namespace)"